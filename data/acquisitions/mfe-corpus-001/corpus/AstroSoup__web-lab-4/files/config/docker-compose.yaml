services:
  postgres:
    image: postgres:15
    container_name: web-lab-4-postgres
    restart: always
    environment:
      POSTGRES_DB: weblab3db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"
  auth:
    build:
      context: ..
      dockerfile: config/backend/auth/Dockerfile
    networks:
      - backend
    depends_on:
      - postgres
  geometry:
    build:
      context: ..
      dockerfile: config/backend/geometry/Dockerfile
    networks:
      - backend
    depends_on:
      - postgres
  broker:
    build:
      context: ..
      dockerfile: config/backend/broker/Dockerfile
    networks:
      - backend
  nginx:
    build: 
      context: ..
      dockerfile: config/nginx/Dockerfile
    ports:
      - "80:8080"
      - "443:8443"
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    networks:
      - backend
    depends_on:
      - auth
      - geometry
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus 
    ports:
      - "9090:9090"
    networks:
      - backend 
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "4050:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - backend
networks:
  backend:
    driver: bridge