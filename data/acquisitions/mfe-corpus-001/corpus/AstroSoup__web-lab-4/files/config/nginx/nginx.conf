worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        return 301 https://$host:8443$request_uri;
    }
    
    server {
        listen 3000;
        server_name localhost;

        add_header Access-Control-Allow-Origin * always;


        root /usr/share/nginx/html/host;
        index index.html;

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 3001;
        server_name localhost;

        root /usr/share/nginx/html/remote-inputs;
        index index.html;

        add_header Access-Control-Allow-Origin * always;

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 3002;
        server_name localhost;

        root /usr/share/nginx/html/remote-results;
        index index.html;

        add_header Access-Control-Allow-Origin * always;

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/self.crt;
        ssl_certificate_key /etc/nginx/certs/self.key;

        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location / {
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
        }

        location /remote-inputs/ {
            proxy_pass http://localhost:3001/;
            proxy_set_header Host $host;
        }

        location /remote-results/ {
            proxy_pass http://localhost:3002/;
            proxy_set_header Host $host;
        }

        location /auth/ {
            proxy_pass http://auth:8080;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;
            proxy_set_header X-Forwarded-Port   443;

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Expose-Headers "Authorization" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /geometry/ {
            proxy_pass http://geometry:8080;

            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  https;
            proxy_set_header X-Forwarded-Port   443;

            add_header Access-Control-Allow-Origin "http://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }


}