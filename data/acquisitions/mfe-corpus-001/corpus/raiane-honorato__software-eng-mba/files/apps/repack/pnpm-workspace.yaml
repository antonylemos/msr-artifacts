packages:
  - "packages/*"

# Fonte única das versões das libs compartilhadas (runtime/singleton).
# Os apps (host, check-in, dashboard) referenciam com "catalog:" em vez do número,
# garantindo que todos exijam exatamente a mesma versão — pré-requisito do singleton.
catalog:
  "@react-navigation/native": ^7.2.2
  "@react-navigation/native-stack": ^7.14.11
  "@react-navigation/bottom-tabs": ^7.15.9
  react-native-safe-area-context: ^5.7.0
  react-native-screens: 4.16.0
  react-native-svg: 15.12.1
  zustand: ^5.0.12
  # Equivalentes bare das libs Expo (D3) — substituem expo-linear-gradient/expo-blur
  react-native-linear-gradient: ^2.8.3
  "@react-native-community/blur": ^4.4.1
