<div class="login-page">
  <ds-card title="Acesso à intranet">
    <form (submit)="onSubmit($event)">
      <label>
        Usuário
        <input type="text" name="usuario" placeholder="usuario.rede" required />
      </label>
      <label>
        Senha
        <input type="password" name="senha" required />
      </label>
      <ds-button type="submit" variant="primary">Entrar</ds-button>
    </form>
  </ds-card>
</div>
